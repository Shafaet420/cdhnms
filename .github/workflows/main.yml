name: Build Laravel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - run: composer install --no-dev --prefer-dist --optimize-autoloader

      - uses: actions/upload-artifact@v4
        with:
          name: cdhnms-build
          path: .
